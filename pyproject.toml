[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coin-trading"
version = "0.1.0"
description = "Risk-first Bybit perpetual futures research and trading bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
bybit = ["pybit>=5.8"]
llm = ["openai>=1.68"]
research = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coin_trading"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

